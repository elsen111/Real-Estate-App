<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">EstateFlow logo</title>
  <desc id="desc">A modern house roof combined with three blue skyscrapers.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3294E8"/>
      <stop offset="1" stop-color="#12366F"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4F91"/>
      <stop offset="1" stop-color="#102B55"/>
    </linearGradient>
  </defs>

  <!-- Skyline -->
  <path d="M78 292V176l72-43v159z" fill="url(#blue)"/>
  <path d="M166 278V91l91-54v241l-21-12-23-14-23 14z" fill="url(#navy)"/>
  <path d="M278 277V119l88 52v121h-44v-15z" fill="url(#blue)"/>

  <!-- House roof and body -->
  <path d="M54 365 252 235l206 130v91L252 329 54 456z" fill="url(#navy)"/>
  <path d="M365 305h57v62l-57-36z" fill="#173D75"/>

  <!-- Window -->
  <g fill="#1A3F78">
    <rect x="208" y="374" width="42" height="42" rx="5"/>
    <rect x="262" y="374" width="42" height="42" rx="5"/>
    <rect x="208" y="428" width="42" height="42" rx="5"/>
    <rect x="262" y="428" width="42" height="42" rx="5"/>
  </g>
</svg>
