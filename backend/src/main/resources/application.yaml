spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/real_estate_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

  devtools:
    restart:
      enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # File upload
  #spring:
  #  servlet:
  #    multipart:
  #      enabled: true
  #      max-file-size: 10MB
  #      max-request-size: 20MB
  #app:
  #  upload:
  #    dir: uploads/properties

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret-key: ${JWT_SECRET:4qVb7xRkW9zP1mN8sT2vX5yZ3cBcDeFgHiJkLmNoPqR}
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 18

  mail:
    from: ${MAIL_USERNAME}
    from-name: EstateFlow

rate-limit:
  enabled: true
  auth:
    capacity: 5
    refill-duration-minutes: 1
  general:
    capacity: 100
    refill-duration-minutes: 1

minio:
  endpoint: ${MINIO_URL}
  access-key: ${MINIO_USERNAME}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET_NAME:estateflow}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.realestate.backend.controller

logging:
  level:
    com.realestate.backend: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN