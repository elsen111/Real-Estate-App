spring:
  application:
    name: estate_flow-backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:real_estate_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

  devtools:
    restart:
      enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret-key: ${JWT_SECRET}
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 18
  mail:
    from: ${MAIL_USERNAME}
    from-name: EstateFlow

payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    currency: ${STRIPE_CURRENCY:usd}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/payment/success?session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/payment/cancelled}

subscription:
  scheduler:
    time-zone: "Asia/Baku"
    expiration-cron: "0 5 * * * *"
    email-cron: "0 * * * * *"

rate-limit:
  enabled: true
  auth:
    capacity: 5
    refill-duration-minutes: 1
  general:
    capacity: 100
    refill-duration-minutes: 1

minio:
  endpoint: ${MINIO_URL:http://minio:9000}
  access-key: ${MINIO_USERNAME}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET_NAME:estateflow}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: /api/api-docs/swagger-config
    disable-swagger-default-url: true
    url: /api/api-docs
  packages-to-scan: com.realestate.backend.controller
  default-flat-param-object: true

logging:
  level:
    com.realestate.backend: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN